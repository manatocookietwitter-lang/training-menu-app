<html lang="ja">

  <style>
    :root{--green:#17823b;--green-dark:#0c5f2a;--green-soft:#eaf6ee;--bg:#f7faf8;--text:#16201a;--muted:#6a756f;--line:#dce6df;--danger:#d94141;--danger-bg:#fff1f1;--shadow:0 10px 26px rgba(18,45,25,.10);--safe-bottom:env(safe-area-inset-bottom,0px)}

    .top{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;min-height:38px}.brand{font-weight:900;color:var(--green-dark);letter-spacing:.04em}.back{width:36px;height:36px;border-radius:999px;background:#fff;box-shadow:var(--shadow);color:var(--green-dark);font-size:20px;display:grid;place-items:center}.title{flex-shrink:0;font-size:18px;line-height:1.2;text-align:left;margin:0 0 6px;letter-spacing:.03em;font-weight:900}.home-title{font-size:clamp(30px,9vw,46px);letter-spacing:.08em;text-align:center;margin:8px 0 6px}.home .top{min-height:44px}.sub-title{text-align:center;color:var(--muted);font-weight:800;font-size:12px;margin:-2px 0 2px}.sub-title strong{color:var(--green)}
    .home-menu{display:flex;flex-direction:column;gap:10px;justify-content:center;flex:1;min-height:0}.home-card{min-height:76px;border-radius:22px;background:#fff;box-shadow:var(--shadow);border:1px solid var(--line);display:grid;grid-template-columns:50px 1fr 22px;align-items:center;gap:14px;padding:14px 16px;text-align:left}.home-icon{width:50px;height:50px;border-radius:18px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-size:24px;font-weight:900}.home-card span:nth-child(2){font-size:19px;font-weight:900}.chevron{color:var(--green);font-size:26px;font-weight:900}
    .field-block{margin-bottom:12px;position:relative}.label{display:block;margin:0 0 6px 4px;font-size:13px;font-weight:900}.text-input,.num-input,.select-button{width:100%;min-height:46px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:0 14px;font-size:14px;font-weight:850}.text-input:focus,.num-input:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(23,130,59,.10)}.select-button{display:flex;align-items:center;justify-content:space-between}.chips{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:rgba(23,130,59,.55) transparent}.chips::-webkit-scrollbar{height:5px}.chips::-webkit-scrollbar-thumb{background:rgba(23,130,59,.45);border-radius:999px}.category-box{min-height:46px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:7px}.chip{flex:0 0 auto;height:31px;border-radius:999px;padding:0 13px;border:1px solid rgba(23,130,59,.28);background:#fff;color:var(--green-dark);font-size:12px;font-weight:900}.chip.active{background:var(--green);border-color:var(--green);color:#fff}.chip.disabled{opacity:.35;filter:grayscale(.25);cursor:not-allowed}.chip.add-chip{border-style:dashed;color:var(--green)}
    .drop-panel{display:none;position:absolute;z-index:20;left:0;right:0;top:calc(100% - 4px);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);max-height:218px;overflow-y:auto;padding:8px}.drop-panel.open{display:block}.drop-item{min-height:40px;border-radius:13px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:14px;font-weight:850}.drop-item.active{background:var(--green-soft);color:var(--green-dark)}.drop-item.add-new{color:var(--green);border-top:1px solid var(--line);margin-top:6px}
    .card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:14px}.static-area{flex:1;min-height:0;overflow:hidden}.scroll-area{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px;scrollbar-width:thin;scrollbar-color:rgba(23,130,59,.6) rgba(23,130,59,.08)}.scroll-area::-webkit-scrollbar{width:7px}.scroll-area::-webkit-scrollbar-thumb{background:rgba(23,130,59,.55);border-radius:999px}
    .menu-select-card{height:min(39dvh,340px);min-height:230px;overflow-y:auto;padding:8px}.menu-row{width:100%;display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:8px;min-height:50px;padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}.menu-row:last-child{border-bottom:0}.select-mark{width:28px;height:28px;border-radius:10px;border:2px solid var(--green);color:var(--green);display:grid;place-items:center;font-size:13px;font-weight:900;background:#fff}.select-mark.selected{border-radius:999px;background:var(--green);color:#fff}.row-name{font-size:14px;font-weight:900}.row-meta{font-size:10px;color:var(--muted);font-weight:800;margin-top:3px}.fixed-pill{padding:5px 8px;border-radius:999px;background:#f1f3f2;color:var(--muted);font-size:10px;font-weight:900;white-space:nowrap}
    .bottom{flex-shrink:0;display:flex;gap:10px}.primary,.secondary,.danger-button{min-height:48px;border-radius:15px;font-size:15px;font-weight:900;flex:1;display:flex;align-items:center;justify-content:center;gap:8px}.primary{background:linear-gradient(180deg,var(--green) 0%,var(--green-dark) 100%);color:#fff;box-shadow:0 10px 24px rgba(23,130,59,.24)}.secondary{background:#fff;color:var(--green-dark);border:1px solid var(--line);box-shadow:var(--shadow)}.danger-button{background:var(--danger);color:#fff}.primary:disabled,.secondary:disabled{opacity:.45}
    .table-card{flex:1;min-height:0;overflow-y:auto;padding:0;border-radius:20px}.set-table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}.set-table th{position:sticky;top:0;z-index:2;background:#f7faf8;padding:8px 5px;border-bottom:1px solid var(--line);font-size:12px}.set-table td{padding:8px 5px;border-bottom:1px solid var(--line);vertical-align:middle}.set-name{font-size:12px;font-weight:900}.set-name small{display:block;color:var(--muted);font-weight:800;margin-top:4px;font-size:9.5px}.stepper{display:inline-flex;align-items:center;justify-content:space-between;width:78px;height:32px;border-radius:999px;border:1px solid var(--line);background:#fff;overflow:hidden}.stepper button{width:26px;height:100%;color:var(--green);font-size:18px;font-weight:900}.stepper span{font-size:11.5px;font-weight:900}.summary{flex-shrink:0;display:grid;gap:6px}.summary-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:9px 11px;box-shadow:var(--shadow)}.summary-grid{display:grid;grid-template-columns:72px 1fr;gap:4px 10px;align-items:baseline;font-size:12px;font-weight:850}.summary-grid .big{font-size:18px;color:var(--green);font-weight:950}.set-total-line{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;line-height:1.2}.set-total-line span{white-space:nowrap}.set-total-line b{color:var(--green);font-size:15px}.note{font-size:10px;color:var(--muted);font-weight:800;margin-top:4px}.note:empty{display:none}.status{border-radius:16px;padding:8px 10px;font-size:12px;font-weight:900;border:1px solid}.status.ok{background:var(--green-soft);border-color:rgba(23,130,59,.35);color:var(--green-dark)}.status.ng{background:var(--danger-bg);border-color:rgba(217,65,65,.35);color:#9e2222}.people-box{flex-shrink:0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:var(--shadow)}.people-title{font-size:11px;color:var(--muted);font-weight:900;margin:0 0 6px 3px}
    .toggle-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:12px}.toggle-card h3{margin:0;font-size:14px}.toggle-card p{margin:4px 0 0;color:var(--muted);font-size:10px;font-weight:700}.switch{width:56px;height:32px;border-radius:999px;background:#d9e2dd;padding:4px;flex-shrink:0}.switch::after{content:"";display:block;width:24px;height:24px;border-radius:999px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18);transition:.2s}.switch.on{background:var(--green)}.switch.on::after{transform:translateX(24px)}
    .list-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.list-title-row .label{margin-bottom:0}.reorder-toggle.active{background:var(--green);color:#fff;border-color:var(--green)}.list-card{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px 10px;margin-bottom:6px;min-height:58px}.list-card h3{margin:0;font-size:14px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list-card p{margin:3px 0 0;color:var(--muted);font-weight:800;font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list-actions{display:flex;flex-direction:row;gap:5px;flex-shrink:0}.mini-btn{min-width:50px;height:28px;border-radius:9px;border:1px solid var(--green);color:var(--green-dark);font-size:11px;font-weight:900;background:#fff}.mini-btn.delete{color:var(--danger);border-color:rgba(217,65,65,.55)}.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);font-weight:850;padding:24px}.top-action{width:auto;min-width:62px;height:34px;border-radius:999px;border:1px solid var(--green);background:#fff;color:var(--green-dark);font-size:12px;font-weight:900;box-shadow:var(--shadow)}.add-list-card{width:100%;border-style:dashed;color:var(--green-dark);text-align:left}.add-list-card h3{color:var(--green-dark)}.drag-handle{width:50px;height:28px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--green-dark);font-size:20px;font-weight:900;display:grid;place-items:center;cursor:grab}.reorder-card{position:relative;cursor:grab}.reorder-card.dragging{opacity:.45}.reorder-card.drop-before::before,.reorder-card.drop-after::after{content:"";position:absolute;left:8px;right:8px;height:4px;border-radius:999px;background:var(--green);box-shadow:0 0 0 3px rgba(23,130,59,.12);z-index:5}.reorder-card.drop-before::before{top:-5px}.reorder-card.drop-after::after{bottom:-5px}
    #screen-list #menuList{flex:1;min-height:0;overflow-y:auto;background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:18px;padding:8px}.history-list{overflow-y:auto!important}.history-card{display:grid;grid-template-columns:86px 1fr;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px;box-shadow:var(--shadow);align-items:center}.history-card img{width:86px;height:120px;object-fit:contain;background:#fff;border-radius:10px;border:1px solid var(--line)}.history-card h3{font-size:14px;margin:0 0 3px}.history-card p{font-size:10px;color:var(--muted);font-weight:800;margin:0 0 7px}.modal-backdrop,.preview-wrap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(5,20,10,.45);z-index:100}.modal-backdrop.open,.preview-wrap.open{display:flex}.modal,.preview-card{width:min(430px,100%);background:#fff;border-radius:22px;padding:16px;box-shadow:0 18px 48px rgba(0,0,0,.28)}.modal h3{margin:0 0 8px}.modal p{margin:0 0 16px;color:var(--muted);font-weight:750}.modal-actions,.preview-actions{display:flex;gap:8px}.preview-actions .secondary{font-size:13px}.preview-card{display:flex;flex-direction:column;gap:12px}.preview-card img{max-width:100%;max-height:calc(100dvh - 170px);object-fit:contain;border-radius:14px;border:1px solid var(--line);background:#fff}
  </style>

<body>
<div class="app">
  <section class="screen active home" id="screen-home">
    <div class="top"><div class="brand">練習メニュー</div></div>
    <h1 class="title home-title">ホーム</h1>
    <div class="home-menu">
      <button class="home-card" data-go="create"><span class="home-icon">▦</span><span>メニュー表作成</span><span class="chevron">›</span></button>
      <button class="home-card" data-go="list"><span class="home-icon">≡</span><span>メニュー一覧</span><span class="chevron">›</span></button>
      <button class="home-card" data-go="categories"><span class="home-icon">□</span><span>分類一覧</span><span class="chevron">›</span></button>
      <button class="home-card" data-go="history"><span class="home-icon">▣</span><span>練習メニュー履歴</span><span class="chevron">›</span></button>
    </div>
  </section>
  <section class="screen" id="screen-create"><div class="top"><button class="back" data-go="home">‹</button></div><h1 class="title">メニュー表作成</h1><div class="static-area"><div class="field-block"><label class="label">分類</label><div class="chips category-box" id="createCategoryChips"></div></div><div class="field-block"><label class="label">メニュー表の名前</label><input class="text-input" id="sheetTitle" value="春練メニュー"></div><div class="field-block"><label class="label">メニュー</label><div class="card menu-select-card" id="menuSelectList"></div></div></div><div class="bottom"><button class="primary" id="startSetBtn">作成</button></div></section>
  <section class="screen" id="screen-sets"><div class="top"><button class="back" data-go="create">‹</button></div><h1 class="title">セット数</h1><div class="sub-title">メニュー表名：<strong id="setSheetTitle">春練メニュー</strong></div><div class="people-box"><div class="people-title">人数パターンを0〜2つ選択</div><div class="chips" id="peopleSelect"></div></div><div class="card table-card"><table class="set-table"><thead id="setHead"></thead><tbody id="setRows"></tbody></table></div><div class="summary"><div class="summary-card"><div class="summary-grid"><div>合計set</div><div class="set-total-line" id="setTotalsLine"></div><div>所要時間</div><div><span class="big" id="totalTime">0分 0秒</span></div></div><div class="note" id="totalNote"></div></div><div class="status ok" id="statusBox">出力可</div></div><div class="bottom"><button class="primary" id="exportImageBtn">画像出力</button></div></section>
  <section class="screen" id="screen-add"><div class="top"><button class="back" data-go="list">‹</button></div><h1 class="title" id="addTitle">メニュー追加</h1><div class="static-area"><div class="card"><div class="field-block"><label class="label">名前</label><input class="text-input" id="menuName" placeholder="例：スマッシュノック"></div><div class="field-block"><label class="label">分類</label><button class="select-button" id="addCategoryBtn"><b id="addCategoryText">分類を選択</b><span>⌄</span></button><div class="drop-panel" id="addCategoryPanel"></div></div><button class="toggle-card" id="fixedToggle" type="button"><div><h3>セット数を選ばないメニュー</h3><p>画像出力でもセット数を表示しません</p></div><span class="switch" id="fixedSwitch"></span></button><div class="field-block"><label class="label" id="timeLabel">時間（秒 / 1set・1人）</label><input class="num-input" id="menuSeconds" type="number" min="0" step="1" placeholder="例：120"></div></div></div><div class="bottom"><button class="primary" id="saveMenuBtn">保存</button></div></section>
  <section class="screen" id="screen-categories"><div class="top"><button class="back" data-go="home">‹</button></div><h1 class="title">分類一覧</h1><div class="scroll-area" id="categoryList"></div></section>
  <section class="screen" id="screen-list"><div class="top"><button class="back" data-go="home">‹</button><button class="top-action" id="menuAddTopBtn">追加</button></div><h1 class="title">メニュー一覧</h1><div class="list-title-row"><label class="label">分類</label><button class="mini-btn reorder-toggle" id="reorderToggle">並び替え</button></div><div class="chips category-box" id="categoryChips"></div><div class="scroll-area" id="menuList"></div></section>
  <section class="screen" id="screen-history"><div class="top"><button class="back" data-go="home">‹</button></div><h1 class="title">練習メニュー履歴</h1><div class="scroll-area history-list" id="historyList"></div></section>
</div>
<div class="modal-backdrop" id="confirmModal"><div class="modal"><h3>消去しますか？</h3><p id="confirmText"></p><div class="modal-actions"><button class="secondary" id="cancelDelete">キャンセル</button><button class="danger-button" id="confirmDelete">消去</button></div></div></div>
<div class="preview-wrap" id="previewWrap"><div class="preview-card"><img id="previewImg" alt="画像プレビュー"><div class="preview-actions"><button class="secondary" id="closePreview">閉じる</button><button class="secondary" id="addHistoryBtn">履歴に追加</button><button class="primary" id="downloadImage">保存</button></div></div></div>
<script>
(()=>{
  const STORAGE_KEY='training-menu-maker-v2', LEGACY_KEY='training-menu-maker-v1', HISTORY_KEY='training-menu-history-v1', HISTORY_DB='training-menu-history-db-v1', HISTORY_STORE='images', HISTORY_MIGRATED_KEY='training-menu-history-migrated-v1';
  const defaultState={categories:[{id:'cat_basic',name:'基礎'},{id:'cat_knock',name:'ノック'},{id:'cat_footwork',name:'フットワーク'},{id:'cat_game',name:'ゲーム'},{id:'cat_core',name:'体幹'},{id:'cat_other',name:'その他'}],menus:[{id:'menu_1',name:'基礎打ち',categoryId:'cat_basic',seconds:300,requiresSets:true},{id:'menu_2',name:'スマッシュノック',categoryId:'cat_knock',seconds:120,requiresSets:true},{id:'menu_3',name:'フットワーク',categoryId:'cat_footwork',seconds:180,requiresSets:true},{id:'menu_4',name:'ゲーム練習',categoryId:'cat_game',seconds:480,requiresSets:true},{id:'menu_5',name:'体幹トレーニング',categoryId:'cat_core',seconds:600,requiresSets:false},{id:'menu_6',name:'休憩',categoryId:'cat_other',seconds:300,requiresSets:false}],history:[]};
  const $=id=>document.getElementById(id);let state=loadState();migrateState();let currentScreen='home',createCategory='all',listCategory='all',selectedMenuIds=[],selectedPeople=[4,5],currentSheetTitle='春練メニュー',setPlan=[],addCategoryId=state.categories[0]?.id||'',editingMenuId=null,deleteTargetId=null,lastImageDataUrl='',lastHistoryDataUrl='',lastHistoryBlob=null,lastHistoryType='image/jpeg',lastImageTitle='',reorderMode=false,dragMenuId=null,historyObjectUrls=[],historyRenderToken=0;
  function uid(p){return `${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`}
  function clone(o){return JSON.parse(JSON.stringify(o))}
  function loadLocalHistory(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY))||[]}catch(e){return[]}}
  function openHistoryDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('IndexedDB unsupported'));return}const req=indexedDB.open(HISTORY_DB,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(HISTORY_STORE))db.createObjectStore(HISTORY_STORE,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
  function txStore(db,mode='readonly'){return db.transaction(HISTORY_STORE,mode).objectStore(HISTORY_STORE)}
  function dataURLToBlob(dataUrl){const parts=String(dataUrl).split(','),meta=parts[0]||'',bin=atob(parts[1]||''),mime=(meta.match(/data:(.*?);base64/)||[])[1]||'image/png',u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);return new Blob([u8],{type:mime})}
  function blobToObjectUrl(blob){return URL.createObjectURL(blob)}function revokeHistoryObjectUrls(){historyObjectUrls.forEach(url=>URL.revokeObjectURL(url));historyObjectUrls=[]}
  function historyExt(item){const type=item?.type||item?.blob?.type||String(item?.dataUrl||'').match(/^data:(.*?);/)?.[1]||'image/png';return type.includes('jpeg')||type.includes('jpg')?'jpg':'png'}
  async function getHistoryRecords(){try{const db=await openHistoryDB();return await new Promise((resolve,reject)=>{const req=txStore(db).getAll();req.onsuccess=()=>resolve((req.result||[]).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt)));req.onerror=()=>reject(req.error)})}catch(e){console.warn('IndexedDB履歴を読めませんでした。localStorage履歴にフォールバックします。',e);return loadLocalHistory().map(item=>({...item,type:String(item.dataUrl||'').match(/^data:(.*?);/)?.[1]||'image/png',blob:null}))}}
  async function putHistoryRecord(item){try{const db=await openHistoryDB();await new Promise((resolve,reject)=>{const req=txStore(db,'readwrite').put(item);req.onsuccess=()=>resolve();req.onerror=()=>reject(req.error)});return true}catch(e){console.error(e);alert('履歴を保存できませんでした。ブラウザの保存容量・設定を確認してください。');return false}}
