<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>練習メニュー</title>
  <meta name="description" content="バドミントンの練習メニューを人数別に組み立て、練習量と所要時間を計算できるアプリです。" />
  <meta name="theme-color" content="#17823b" />
  <meta name="application-name" content="練習メニュー" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="練習メニュー" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32-v2.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-v2.png" />
  <link rel="stylesheet" href="./styles.css?v=20260805-1" />
</head>
<body>
<div class="app">
  <section class="screen active home" id="screen-home">
    <div class="top"><div class="brand">BADMINTON PLANNER</div></div>
    <h1 class="title home-title">練習メニュー</h1>
    <p class="home-lead">人数に合わせて、練習量と時間をかんたんに。</p>
    <div class="home-menu">
      <button class="home-card" data-go="create"><span class="home-icon">▦</span><span class="home-copy"><strong>メニュー表作成</strong><small>人数別の練習量と時間を計算</small></span><span class="chevron">›</span></button>
      <button class="home-card" data-go="list"><span class="home-icon">≡</span><span class="home-copy"><strong>メニュー一覧</strong><small>追加・編集・並び替え</small></span><span class="chevron">›</span></button>
      <button class="home-card" data-go="categories"><span class="home-icon">□</span><span class="home-copy"><strong>分類一覧</strong><small>練習メニューを分類して管理</small></span><span class="chevron">›</span></button>
      <button class="home-card" data-go="history"><span class="home-icon">▣</span><span class="home-copy"><strong>練習メニュー履歴</strong><small>保存したメニュー表を確認</small></span><span class="chevron">›</span></button>
    </div>
  </section>
  <section class="screen" id="screen-create"><div class="top"><button class="back" data-go="home" aria-label="ホームに戻る">‹</button><h1 class="title">メニュー表作成</h1><span class="top-spacer"></span></div><div class="static-area create-fields"><div class="field-block"><label class="label">分類</label><div class="chips category-box" id="createCategoryChips"></div></div><div class="field-block"><label class="label" for="sheetTitle">メニュー表の名前</label><input class="text-input" id="sheetTitle" value="春練メニュー"></div><div class="field-block menu-field"><div class="label-row"><label class="label">メニュー</label><span class="count-badge" id="selectedMenuCount">0件選択</span></div><div class="card menu-select-card" id="menuSelectList"></div></div></div><div class="bottom"><button class="primary" id="startSetBtn">メニューを選択</button></div></section>
  <section class="screen" id="screen-sets"><div class="top"><button class="back" data-go="create" aria-label="メニュー選択に戻る">‹</button><h1 class="title">セット数</h1><span class="top-spacer"></span></div><div class="sub-title">メニュー表名：<strong id="setSheetTitle">春練メニュー</strong></div><div class="people-box"><div class="people-title">比較する人数を2つまで選択</div><div class="chips" id="peopleSelect"></div></div><div class="card table-card"><table class="set-table"><thead id="setHead"></thead><tbody id="setRows"></tbody></table></div><div class="summary"><div class="summary-card"><div class="summary-grid"><div>合計人set</div><div class="set-total-line" id="setTotalsLine"></div><div>所要時間</div><div><span class="big" id="totalTime">0分 0秒</span></div></div><div class="note" id="totalNote"></div></div><div class="status ok" id="statusBox" aria-live="polite">出力可</div></div><div class="bottom"><button class="primary" id="exportImageBtn">画像出力</button></div></section>
  <section class="screen" id="screen-add"><div class="top"><button class="back" data-go="list" aria-label="メニュー一覧に戻る">‹</button><h1 class="title" id="addTitle">メニュー追加</h1><span class="top-spacer"></span></div><div class="static-area form-scroll"><div class="card form-card"><div class="field-block"><label class="label" for="menuName">名前</label><input class="text-input" id="menuName" placeholder="例：スマッシュノック"></div><div class="field-block"><label class="label">分類</label><button class="select-button" id="addCategoryBtn"><b id="addCategoryText">分類を選択</b><span>⌄</span></button><div class="drop-panel" id="addCategoryPanel"></div></div><button class="toggle-card" id="fixedToggle" type="button"><div><h3>固定時間のメニュー</h3><p>セット数に関係なく、1回分の時間で計算します</p></div><span class="switch" id="fixedSwitch" aria-hidden="true"></span></button><div class="field-block"><label class="label" id="timeLabel" for="menuSeconds">時間（秒 / 1set・1人）</label><input class="num-input" id="menuSeconds" type="number" min="0" step="1" inputmode="numeric" placeholder="例：120（2分）"></div></div></div><div class="bottom"><button class="primary" id="saveMenuBtn">保存</button></div></section>
  <section class="screen" id="screen-categories"><div class="top"><button class="back" data-go="home" aria-label="ホームに戻る">‹</button><h1 class="title">分類一覧</h1><span class="top-spacer"></span></div><div class="scroll-area" id="categoryList"></div></section>
  <section class="screen" id="screen-list"><div class="top"><button class="back" data-go="home" aria-label="ホームに戻る">‹</button><h1 class="title">メニュー一覧</h1><button class="top-action" id="menuAddTopBtn">追加</button></div><div class="list-title-row"><div><span class="label section-label">分類</span><span class="list-count" id="listCount"></span></div><button class="mini-btn reorder-toggle" id="reorderToggle" aria-pressed="false">並び替え</button></div><div class="chips category-box" id="categoryChips"></div><p class="helper-text" id="reorderHint" hidden>右の持ち手をドラッグ。同じ分類内で並び替えできます。</p><div class="scroll-area" id="menuList"></div><div class="sr-only" id="reorderStatus" aria-live="polite"></div></section>
  <section class="screen" id="screen-history"><div class="top"><button class="back" data-go="home" aria-label="ホームに戻る">‹</button><h1 class="title">練習メニュー履歴</h1><span class="top-spacer"></span></div><div class="scroll-area history-list" id="historyList"></div></section>
</div>
<div class="modal-backdrop" id="confirmModal"><div class="modal"><h3>消去しますか？</h3><p id="confirmText"></p><div class="modal-actions"><button class="secondary" id="cancelDelete">キャンセル</button><button class="danger-button" id="confirmDelete">消去</button></div></div></div>
<div class="preview-wrap" id="previewWrap"><div class="preview-card"><img id="previewImg" alt="画像プレビュー"><div class="preview-actions"><button class="secondary" id="closePreview">閉じる</button><button class="secondary" id="addHistoryBtn">履歴に追加</button><button class="primary" id="downloadImage">保存</button></div></div></div>
<script src="./app.js?v=20260805-1"></script>
</body>
</html>
